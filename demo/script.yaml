# SiteMind demo video script.
#
# Each scene has:
#   id / title      chapter tag shown top-left in the video
#   card            (optional) title-card name rendered by demo/titlecards.py instead of the dashboard
#   narration       list of sentences; each one is synthesised separately (exact subtitle timing).
#                   `say:` overrides the spoken form (pronunciation), `text:` is what the subtitle shows.
#   actions         dashboard actions performed by demo/record.mjs (see that file for the DSL)
#   min_s           (optional) minimum scene length in seconds (default: narration length + pad)
#
# Run conditions (`until:`) are JavaScript expressions evaluated against the latest RunSnapshot `s`
# (GET /api/runs/{id}); see backend/sitemind/models.py for its fields.

meta:
  voice: en_US-lessac-high
  length_scale: 1.0          # >1 = slower speech
  sentence_gap_s: 0.28       # silence between sentences
  scene_lead_s: 0.35         # silence before narration starts in each scene
  scene_tail_s: 0.6          # hold after narration ends
  max_total_s: 178           # hard cap (Devpost allows 5 min; we aim for <= 3:00)
  max_speedup: 10.0           # long agent waits are time-lapsed (labelled on screen) up to this factor
  base_url: http://localhost:8000

scenes:
  - id: 1
    title: "The problem"
    card: title
    narration:
      - text: "This is SiteMind: a durable procurement agent for construction."
        say: "This is SiteMind. A durable procurement agent for construction."
      - text: "On a 24 MW data-centre job, long-lead 480 V switchgear is the number-one schedule risk."
        say: "On a twenty four megawatt data centre job, long-lead, four-eighty volt switchgear is the number one schedule risk."
      - text: "Today, coordinators juggle quotes, lead times and budgets in email and Excel, for weeks."
        say: "Today, procurement coordinators juggle quotes, lead times and budgets in email and Excel, for weeks."
      - text: "Project Alpha is a Tier-III build at Chakan, Pune, and one missed date slips energisation."
        say: "Project Alpha is a tier three build at Chakan, Pune, and one missed date slips energisation."

  - id: 2
    title: "A goal in plain English"
    narration:
      - text: "We hand SiteMind one goal, in plain English."
      - text: "Order the 480 V switchgear for Project Alpha by 15 March 2027, within ₹4.6 crore."
        say: "Get the four-eighty volt switchgear for Project Alpha ordered by the fifteenth of March, twenty twenty seven, within four point six crore rupees."
    actions:
      - { do: goto, path: "/" }
      - { do: wait_selector, testid: launch-button, timeout: 30 }
      - { do: type, testid: goal-input, delay: 18, optional: true }
      - { do: highlight, testid: budget-input, hold: 0.8, optional: true }
      - { do: highlight, testid: launch-button, hold: 0.6 }
      - { do: launch }

  - id: 3
    title: "It plans the job"
    narration:
      - text: "A local model on this laptop drafts the plan: a task graph with deadlines, budget and risks."
      - text: "Fourteen tasks, five risks."
      - text: "Each step is assigned to a specialist agent, and the simulated clock starts on day one."
    actions:
      - { do: click, testid: tab-overview, optional: true }
      - { do: wait_run, until: "s.plan && s.plan.tasks && s.plan.tasks.length > 0", timeout: 120 }
      - { do: highlight, testid: task-graph, hold: 2.5 }
      - { do: highlight, testid: sim-clock, hold: 1.5 }

  - id: 4
    title: "Specialists at work"
    narration:
      - text: "The takeoff specialist reads the switchgear spec PDF and extracts every line item, with its source."
      - text: "It finds eight items, and flags one mismatch against the drawing for an RFI."
        say: "It finds eight items, and flags one mismatch against the drawing for an R F I."
      - text: "Then requests for quotation go out to three mock vendors, each sent exactly once."
      - text: "The vendors and prices are synthetic."
    actions:
      - { do: wait_run, until: "!!s.takeoff", timeout: 120 }
      - { do: highlight, testid: timeline, hold: 2.0 }
      - { do: wait_run, until: "(s.ledger||[]).filter(l => l.kind && l.kind.startsWith('rfq')).length >= 1 || (s.vendor_attempts||[]).length >= 1", timeout: 120 }
      - { do: highlight, testid: vendor-table, hold: 2.5 }

  - id: 5
    title: "Things go wrong. It re-plans."
    narration:
      - text: "Real vendors are messy. Voltaris times out twice; the agent backs off and retries."
      - text: "Kestrel then revises its price up fourteen percent, a copper surcharge plus a lost discount, which breaks the budget."
      - text: "SiteMind notices, and re-plans to version two instead of blindly continuing."
    actions:
      - { do: wait_run, until: "(s.vendor_attempts||[]).some(a => a.outcome === 'timeout')", timeout: 150 }
      - { do: highlight, testid: vendor-table, hold: 2.5 }
      - { do: wait_run, until: "(s.quotes||[]).some(q => q.status === 'revised' || q.revision > 1)", timeout: 150, optional: true }
      - { do: highlight, testid: revised-V2, hold: 1.5, optional: true }
      - { do: highlight, testid: budget-chart, hold: 2.0 }
      # hold the narration first, then catch the re-plan and go straight to the kill (scene 6)
      # so the worker is still mid-run when it is killed
      - { do: hold_narration, early: 2.5 }
      - { do: wait_run, until: "(s.plan && s.plan.version >= 2) || (s.plan_history||[]).length >= 2", timeout: 180 }
      - { do: highlight, testid: plan-diff, hold: 1.8, optional: true }

  - id: 6
    title: "Kill the worker"
    narration:
      - text: "Now the hard part. We kill the worker process, mid-run, with SIGKILL."
        say: "Now the hard part. We kill the worker process, mid-run, with sig-kill."
      - text: "No graceful shutdown. The agent is simply gone."
    actions:
      # kill inside a side-effect task's pacing window (after its side effect, before its checkpoint)
      # so the resumed worker re-requests that action and the ledger shows "x2 requested, executed once"
      - { do: wait_run, until: "s.status === 'running' && /(negotiate|expedite).*:pacing$/.test(s.current_node || '')", timeout: 25, optional: true }
      - { do: wait_run, until: "s.status === 'running' && s.worker && s.worker.alive", timeout: 8, optional: true }
      - { do: highlight, testid: worker-status, hold: 0.8 }
      - { do: kill }
      - { do: wait_run, until: "s.status === 'killed' || (s.worker && !s.worker.alive)", timeout: 30 }
      - { do: highlight, testid: worker-status, hold: 2.0 }

  - id: 7
    title: "Resume from checkpoint"
    narration:
      - text: "A fresh worker resumes from the last LangGraph checkpoint, saved after every task."
      - text: "The action ledger shows it: every action appears once, and anything requested twice was still executed only once."
      - text: "No duplicate emails. No duplicate orders."
    actions:
      - { do: highlight, testid: resume-button, hold: 1.0 }
      - { do: resume }
      - { do: wait_run, until: "s.status === 'running' || s.status === 'waiting_human' || s.status === 'completed'", timeout: 60 }
      - { do: wait_run, until: "(s.worker && s.worker.restarts >= 1) || s.status !== 'killed'", timeout: 30, optional: true }
      - { do: click, testid: tab-audit }
      - { do: click, testid: audit-view-ledger }
      - { do: wait_run, until: "(s.ledger||[]).some(l => l.executions >= 2)", timeout: 20, optional: true }
      - { do: pause, s: 1.0 }
      - { do: highlight, testid: ledger-dedup, hold: 3.0, optional: true }
      - { do: highlight, testid: ledger-table, hold: 2.0, optional: true }

  - id: 8
    title: "A human signs off"
    narration:
      - text: "Before anything that can't be undone, SiteMind stops and asks a person."
      - text: "The decision memo ranks every option on cost, delivery float and reliability, and recommends one: Anvil's expedited slot, ₹26 lakh extra, on site before the deadline."
        say: "The decision memo ranks every option on cost, delivery float and reliability, and recommends one: Anvil's expedited slot, twenty six lakh extra, on site before the deadline."
      - text: "Voltaris is cheaper, but would arrive late."
      - text: "The project manager approves it."
    actions:
      - { do: click, testid: tab-overview }
      - { do: highlight, testid: task-graph, hold: 1.0, optional: true }
      - { do: wait_run, until: "(s.approvals||[]).some(a => a.status === 'pending')", timeout: 180 }
      - { do: click, testid: tab-approvals }
      - { do: highlight, testid: approvals-inbox, hold: 3.0 }
      - { do: scroll, testid: approvals-inbox, dy: 300, optional: true }
      - { do: approve }

  - id: 9
    title: "Purchase order sent"
    narration:
      - text: "It drafts the purchase order, asks once more before release, then sends it exactly once: ₹4.7 crore with GST, 33 days ahead of the order-by date."
        say: "It drafts the purchase order, asks once more before release, then sends it exactly once: four point seven crore with G S T, thirty three days ahead of the order-by date."
      - text: "Every decision, specialist call and rupee is in the audit trail."
    actions:
      - { do: approve_all, until: "(s.po && s.po.status === 'sent') || s.status === 'completed'", timeout: 180 }
      - { do: click, testid: tab-po }
      - { do: wait_selector, testid: po-package, timeout: 20 }
      - { do: highlight, testid: po-package, hold: 2.5 }
      - { do: scroll, testid: po-package, dy: 400, optional: true }
      - { do: click, testid: tab-audit }
      - { do: click, testid: audit-view-ledger, optional: true }
      - { do: highlight, testid: ledger-dedup, hold: 2.5, optional: true }

  - id: 10
    title: "Impact"
    card: closing
    narration:
      - text: "Weeks of chasing, down to minutes. Every decision audited."
      - text: "It survives crashes without repeating itself, and it is open source, running on a laptop with a local model."
      - text: "SiteMind."
