[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitemind"
version = "0.1.0"
description = "SiteMind: durable, long-horizon procurement agent for construction"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic-ai-slim[openai]>=0.4",
  "mcp>=1.2",
  "pdfplumber>=0.11",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
sitemind = "sitemind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sitemind"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "llm: hits a real local LLM (ollama); skipped if unreachable",
  "slow: long-running integration tests",
]
addopts = "-q"
